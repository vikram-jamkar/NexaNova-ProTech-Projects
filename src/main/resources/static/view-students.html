<!DOCTYPE html>
<html>
<head>
<title>View Students</title>

<style>
body{
    font-family:Arial;
    background:#f4f6f9;
}

.container{
    width:90%;
    margin:auto;
    margin-top:30px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
}

th,td{
    border:1px solid gray;
    padding:10px;
    text-align:center;
}

th{
    background:#28a745;
    color:white;
}

h1{
    text-align:center;
}
</style>

</head>

<body>

<div class="container">

<h1>Student List</h1>

<table>

<thead>
<tr>
<th>ID</th>
<th>Name</th>
<th>Email</th>
</tr>
</thead>

<tbody id="studentTable">

</tbody>

</table>

</div>

<script>

async function loadStudents(){

    let response =
    await fetch(
    "http://localhost:8080/getAllStudents"
    );

    let students =
    await response.json();

    let data = "";

    for(let student of students){

        data += `
        <tr>
            <td>${student.id}</td>
            <td>${student.name}</td>
            <td>${student.email}</td>
        </tr>
        `;
    }

    document.getElementById(
    "studentTable"
    ).innerHTML = data;
}

loadStudents();

</script>

</body>
</html>
