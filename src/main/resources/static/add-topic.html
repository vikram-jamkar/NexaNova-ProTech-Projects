<!DOCTYPE html>
<html>
<head>
<title>Add Topic</title>

<style>

body{
    font-family:Arial;
    background:#f5f5f5;
}

.container{
    width:500px;
    margin:auto;
    margin-top:100px;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0px 0px 10px gray;
    text-align:center;
}

input{
    width:90%;
    padding:10px;
    margin:10px;
}

button{
    padding:10px 20px;
    background:blue;
    color:white;
    border:none;
}

</style>

</head>

<body>

<div class="container">

<h1>Add Topic</h1>

<input type="text"
id="topicName"
placeholder="Enter Topic Name">
<input type="number"
id="subjectId"
placeholder="Enter Subject Id">

<br>

<button onclick="saveTopic()">
Save Topic
</button>

</div>

<script>

async function saveTopic(){

    let topicName =
    document.getElementById("topicName").value;
    

    let response = await fetch(
    "http://localhost:8080/saveTopic",
    {
        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({

        
        	topicName:topicName,

        	subject:{
        	    id:parseInt(
        	        document.getElementById("subjectId").value
        	    )
        	}
        	

        	})

        
    });

    alert("Topic Saved Successfully");
}

</script>

</body>
</html>
