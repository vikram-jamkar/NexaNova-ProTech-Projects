<!DOCTYPE html>
<html>
<head>
<title>Add Subject</title>

<style>

body{
    font-family:Arial;
    background:#f5f5f5;
}

.container{
    width:500px;
    margin:auto;
    margin-top:100px;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0px 0px 10px gray;
    text-align:center;
}

input{
    width:90%;
    padding:10px;
    margin:10px;
}

button{
    padding:10px 20px;
    background:blue;
    color:white;
    border:none;
}

</style>

</head>

<body>

<div class="container">

<h1>Add Subject</h1>

<input type="text"
id="subjectName"
placeholder="Enter Subject Name">

<br>

<button onclick="saveSubject()">
Save Subject
</button>

</div>

<script>

async function saveSubject(){

    let subjectName =
    document.getElementById("subjectName").value;

    let response = await fetch(
    "http://localhost:8080/saveSubject",
    {
        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({
            subjectName:subjectName
        })
    });

    alert("Subject Saved Successfully");
}

</script>

</body>
</html>
