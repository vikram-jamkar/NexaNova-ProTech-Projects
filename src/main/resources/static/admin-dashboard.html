<!DOCTYPE html>
<html>
<head>
<title>Admin Dashboard</title>

<style>

body{
    font-family:Arial;
    background:#f5f5f5;
}

.dashboard{
    width:700px;
    margin:auto;
    margin-top:50px;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0px 0px 10px gray;
    text-align:center;
}

h1{
    color:#1e3a8a;
}

button{
    width:250px;
    padding:15px;
    margin:10px;
    border:none;
    border-radius:8px;
    background:#2563eb;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

</style>

</head>

<body>

<div class="dashboard">

<h1>Admin Dashboard</h1>

<h3>Quiz Management System</h3>

<button onclick="addSubject()">
Add Subject
</button>

<br>

<button onclick="addTopic()">
Add Topic
</button>

<br>

<button onclick="addQuestion()">
Add Question
</button>

<br>

<button onclick="createQuiz()">
Create Quiz
</button>

<br>

<button onclick="viewStudents()">
View Students
</button>



<br>

<button onclick="viewResults()">
View Results
</button>
</div>

<script>

function addSubject(){
    window.location.href="add-subject.html";
}

function addTopic(){
    window.location.href="add-topic.html";
}

function addQuestion(){
    window.location.href="add-question.html";
}

function createQuiz(){
    window.location.href="create-quiz.html";
}

function viewStudents(){
    window.location.href="view-students.html";
}
function viewResults(){
    window.location.href="view-results.html";
}
</script>

</body>
</html>
