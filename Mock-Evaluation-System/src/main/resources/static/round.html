<!DOCTYPE html>
<html>
<head>
<title>Round Management</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

<h2 class="text-center">Round Management</h2>

<input type="hidden" id="rid">

<input id="name" class="form-control mt-2" placeholder="Round Name">

<button onclick="save()" class="btn btn-primary mt-3">Save</button>

<hr>

<button onclick="load()" class="btn btn-success">Load Rounds</button>

<table class="table table-bordered mt-3">
<thead class="table-dark">
<tr>
<th>ID</th>
<th>Name</th>
<th>Action</th>
</tr>
</thead>

<tbody id="data"></tbody>
</table>

</div>

<script>

function save(){

let id = document.getElementById("rid").value;

let url = "http://localhost:8080/rounds";
let method = "POST";

if(id){
    url = "http://localhost:8080/rounds/" + id;
    method = "PUT";
}

fetch(url,{
method:method,
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
name:document.getElementById("name").value
})
})
.then(()=>{
alert("Saved Successfully");
load();
clearForm();
});
}

function load(){
fetch("http://localhost:8080/rounds")
.then(res=>res.json())
.then(list=>{
let rows="";
list.forEach(r=>{
rows+=`
<tr>
<td>${r.id}</td>
<td>${r.name}</td>
<td>
<button onclick="edit(${r.id},'${r.name}')" class="btn btn-warning btn-sm">Edit</button>
<button onclick="del(${r.id})" class="btn btn-danger btn-sm">Delete</button>
</td>
</tr>
`;
});
document.getElementById("data").innerHTML=rows;
});
}

function edit(id,name1){
document.getElementById("rid").value=id;
document.getElementById("name").value=name1;
}

function del(id){
fetch("http://localhost:8080/rounds/"+id,{
method:"DELETE"
})
.then(()=>load());
}

function clearForm(){
document.getElementById("rid").value="";
document.getElementById("name").value="";
}

</script>

</body>
</html>
