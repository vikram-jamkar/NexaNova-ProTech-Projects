<!DOCTYPE html>
<html>
<head>
<title>Evaluation</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

<h2>Evaluation Module</h2>

<input id="pid" class="form-control mt-2" placeholder="Participant ID">
<input id="tid" class="form-control mt-2" placeholder="Technology ID">
<input id="rid" class="form-control mt-2" placeholder="Round ID">
<input id="eid" class="form-control mt-2" placeholder="Evaluator ID">
<input id="marks" class="form-control mt-2" placeholder="Marks">
<input id="feedback" class="form-control mt-2" placeholder="Feedback">

<button onclick="save()" class="btn btn-dark mt-3">Submit Evaluation</button>

<hr>

<button onclick="load()" class="btn btn-primary">View Report</button>

<table class="table table-bordered mt-3">
<thead>
<tr>
<th>Participant</th>
<th>Technology</th>
<th>Round</th>
<th>Evaluator</th>
<th>Marks</th>
<th>Feedback</th>
</tr>
</thead>

<tbody id="data"></tbody>

</table>

</div>

<script>

function save(){
fetch("http://localhost:8080/evaluations",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
participant:{id:pid.value},
technology:{id:tid.value},
round:{id:rid.value},
evaluator:{id:eid.value},
marks:marks.value,
feedback:feedback.value
})
})
.then(()=>alert("Evaluation Submitted"));
}

function load(){
fetch("http://localhost:8080/evaluations")
.then(r=>r.json())
.then(list=>{
let rows="";
list.forEach(e=>{
rows+=`
<tr>
<td>${e.participant?.name}</td>
<td>${e.technology?.name}</td>
<td>${e.round?.name}</td>
<td>${e.evaluator?.name}</td>
<td>${e.marks}</td>
<td>${e.feedback}</td>
</tr>
`;
});
data.innerHTML=rows;
});
}

</script>

</body>
</html>
