<!DOCTYPE html>
<html>
<head>
<title>Technology Management</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

<h2 class="text-center">Technology Management</h2>

<!-- 🔹 FORM -->
<input type="hidden" id="tid">

<input id="name" class="form-control mt-2" placeholder="Technology Name">

<button onclick="save()" class="btn btn-primary mt-3">Save</button>

<hr>

<!-- 🔹 LOAD -->
<button onclick="load()" class="btn btn-success">Load Technologies</button>

<table class="table table-bordered mt-3">
<thead class="table-dark">
<tr>
<th>ID</th>
<th>Name</th>
<th>Action</th>
</tr>
</thead>

<tbody id="data"></tbody>
</table>

</div>

<script>

// 🔥 SAVE (ADD + UPDATE)
function save(){

let id = document.getElementById("tid").value;

let url = "http://localhost:8080/technologies";
let method = "POST";

if(id){
    url = "http://localhost:8080/technologies/" + id;
    method = "PUT";
}

fetch(url,{
method:method,
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
name:document.getElementById("name").value   // ✅ FIX
})
})
.then(()=>{
alert("Saved Successfully");
load();
clearForm();
});
}

// 🔥 LOAD
function load(){
fetch("http://localhost:8080/technologies")
.then(res=>res.json())
.then(list=>{
let rows="";
list.forEach(t=>{
rows+=`
<tr>
<td>${t.id}</td>
<td>${t.name}</td>
<td>
<button onclick="edit(${t.id},'${t.name}')" class="btn btn-warning btn-sm">Edit</button>
<button onclick="del(${t.id})" class="btn btn-danger btn-sm">Delete</button>
</td>
</tr>
`;
});
document.getElementById("data").innerHTML=rows;
});
}

// 🔥 EDIT
function edit(id,name1){
document.getElementById("tid").value=id;
document.getElementById("name").value=name1;
}

// 🔥 DELETE
function del(id){
if(confirm("Delete this technology?")){
fetch("http://localhost:8080/technologies/"+id,{
method:"DELETE"
})
.then(()=>{
load();
});
}
}

// 🔥 CLEAR
function clearForm(){
document.getElementById("tid").value="";
document.getElementById("name").value="";
}

</script>

</body>
</html>
