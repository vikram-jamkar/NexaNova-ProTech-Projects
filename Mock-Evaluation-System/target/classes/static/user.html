<!DOCTYPE html>
<html>
<head>
<title>User Management</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

<h2 class="text-center">User Management</h2>

<!-- 🔹 FORM -->
<input type="hidden" id="uid">

<input id="name" class="form-control mt-2" placeholder="Name">

<input id="email" class="form-control mt-2" placeholder="Email">

<input id="password" type="password" class="form-control mt-2" placeholder="Password">

<input id="role" class="form-control mt-2" placeholder="Role (ADMIN / EVALUATOR)">

<button onclick="save()" class="btn btn-primary mt-3">Save</button>

<hr>

<!-- 🔹 LOAD -->
<button onclick="load()" class="btn btn-success">Load Users</button>

<table class="table table-bordered mt-3">
<thead class="table-dark">
<tr>
<th>ID</th>
<th>Name</th>
<th>Email</th>
<th>Role</th>
<th>Action</th>
</tr>
</thead>

<tbody id="data"></tbody>
</table>

</div>

<script>

// 🔥 SAVE (ADD + UPDATE)
function save(){

let id = document.getElementById("uid").value;

let url = "http://localhost:8080/users";
let method = "POST";

if(id){
    url = "http://localhost:8080/users/" + id;
    method = "PUT";
}

fetch(url,{
method:method,
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
name:document.getElementById("name").value,
email:document.getElementById("email").value,
password:document.getElementById("password").value,
role:document.getElementById("role").value
})
})
.then(()=>{
alert("Saved Successfully");
load();
clearForm();
});
}

// 🔥 LOAD
function load(){
fetch("http://localhost:8080/users")
.then(res=>res.json())
.then(list=>{
let rows="";
list.forEach(u=>{
rows+=`
<tr>
<td>${u.id}</td>
<td>${u.name}</td>
<td>${u.email}</td>
<td>${u.role}</td>
<td>
<button onclick="edit(${u.id},'${u.name}','${u.email}','${u.role}')" class="btn btn-warning btn-sm">Edit</button>
<button onclick="del(${u.id})" class="btn btn-danger btn-sm">Delete</button>
</td>
</tr>
`;
});
document.getElementById("data").innerHTML=rows;
});
}

// 🔥 EDIT
function edit(id,name1,email1,role1){
document.getElementById("uid").value=id;
document.getElementById("name").value=name1;
document.getElementById("email").value=email1;
document.getElementById("role").value=role1;
}

// 🔥 DELETE
function del(id){
if(confirm("Delete this user?")){
fetch("http://localhost:8080/users/"+id,{
method:"DELETE"
})
.then(()=>{
load();
});
}
}

// 🔥 CLEAR
function clearForm(){
document.getElementById("uid").value="";
document.getElementById("name").value="";
document.getElementById("email").value="";
document.getElementById("password").value="";
document.getElementById("role").value="";
}

</script>

</body>
</html>
