<!DOCTYPE html>
<html>

<head>

    <title>Quiz Application</title>

    <style>

        body{

            font-family: Arial;

            padding: 30px;

            background-color: #f5f5f5;

        }

        .quiz-box{

            background-color: white;

            padding: 20px;

            border-radius: 10px;

            width: 500px;

            margin: auto;

            box-shadow: 0px 0px 10px gray;

        }

        h1{

            text-align: center;

        }

        #timer{

            color: red;

            text-align: right;

        }

        button{

            padding: 10px;

            margin: 10px;

            border: none;

            background-color: blue;

            color: white;

            border-radius: 5px;

            cursor: pointer;

        }

        button:hover{

            background-color: darkblue;

        }
#navigationPanel{
    margin-top:20px;
    text-align:center;
}

.navBtn{
    width:40px;
    height:40px;
    margin:5px;
    background:red;
}
    </style>

</head>

<body>

    <div class="quiz-box">

        <h1>Java Quiz</h1>

        <h2 id="timer">60</h2>

        <h2 id="question"></h2>

        <div id="options"></div>
           <div id="navigationPanel"></div>
        <button onclick="previousQuestion()">Previous</button>

        <button onclick="nextQuestion()">Next</button>

        <button onclick="submitQuiz()">Submit</button>

    </div>

    <script>

        let time = 60;

        let currentQuestion = 0;

        let answers = [];

        let questions = [

           
        ];

        function loadQuestion(){

            document.getElementById("question").innerHTML =

            questions[currentQuestion].question;

            let options = [

                questions[currentQuestion].option1,
                questions[currentQuestion].option2,
                questions[currentQuestion].option3,
                questions[currentQuestion].option4

            ];

            let optionsHtml = "";

            for(let option of options){

                optionsHtml +=

                `<input type="radio"
                name="option"
                value="${option}">
                ${option}
                <br><br>`;
            
            
            }

            document.getElementById("options").innerHTML = optionsHtml;
            createNavigationPanel();
            
        }
        

        
        
        let timer = setInterval(() => {

            document.getElementById("timer").innerHTML =
            	
            "Time Left : " + time;

            time--;

            if(time < 0){

                clearInterval(timer);

                submitQuiz();

            }

        },1000);

        function saveAnswer(){

            let selectedOption =

            document.querySelector('input[name="option"]:checked');

            if(selectedOption){

                answers[currentQuestion] = {

                    questionId :

                    questions[currentQuestion].id,

                    selectedAnswer :

                    selectedOption.value

                };
                createNavigationPanel();
            }

        }

        function nextQuestion(){

            saveAnswer();

            currentQuestion++;

            if(currentQuestion < questions.length){

               
            	loadQuestion();
            }
            else{

                alert("Last Question");

                currentQuestion--;

            }

        }

        function previousQuestion(){

            saveAnswer();

            currentQuestion--;

            if(currentQuestion >= 0){

            	 loadQuestion();

            }
            else{

                currentQuestion = 0;

            }

        }

        async function submitQuiz(){
        	alert("Submit Button Clicked");

        	alert("Before API Call");

            clearInterval(timer);

            saveAnswer();

            let requestData = {

           studentId : localStorage.getItem("studentId"),

                quizId : 1,

                answers : answers

            };

            let response = await fetch(

            "http://localhost:8080/submitQuiz",

            {

                method:"POST",

                headers:{

                    "Content-Type":"application/json"

                },

                body:JSON.stringify(requestData)

            });

            let result = await response.text();
            alert("API Success")
            alert(result);
            localStorage.setItem("marks", answers.length);
            localStorage.setItem("percentage", result);

            window.location.href = "result.html";

        }
      
        function createNavigationPanel(){

            let panel =
            document.getElementById("navigationPanel");

            panel.innerHTML = "";

            for(let i=0;i<questions.length;i++){

                let color = "red";

                if(i == currentQuestion){

                    color = "orange";

                }
                else if(answers[i]){

                    color = "green";

                }

                panel.innerHTML +=
                `<button class="navBtn"
                style="background:${color}"
                onclick="goToQuestion(${i})">
                ${i+1}
                </button>`;
            }
        }
        
        
        

        function goToQuestion(index){

            currentQuestion = index;
            loadQuestion();
           
        }
        async function getQuestions(){

        
        	let response =
        	await fetch(
        	"http://localhost:8080/getAllQuestion"
        	);

        	questions =
        	await response.json();

        	
        	 loadQuestion();

        	}

        	getQuestions();


    </script>

</body>

</html>
