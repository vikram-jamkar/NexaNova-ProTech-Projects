<!DOCTYPE html>

<html>
<head>
    <title>Online Quiz Application</title>

```
<style>

    *{
        margin:0;
        padding:0;
        font-family:Arial, sans-serif;
    }

    body{
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:linear-gradient(135deg,#1e3c72,#2a5298);
    }

    .container{
        background:white;
        width:500px;
        padding:40px;
        border-radius:20px;
        text-align:center;
        box-shadow:0 10px 25px rgba(0,0,0,0.3);
    }

    h1{
        color:#1e3c72;
        margin-bottom:10px;
    }

    p{
        color:gray;
        margin-bottom:30px;
    }

    .btn{
        width:100%;
        padding:15px;
        margin-top:15px;
        border:none;
        border-radius:10px;
        font-size:18px;
        cursor:pointer;
        transition:0.3s;
        color:white;
    }

    .admin{
        background:#dc2626;
    }

    .admin:hover{
        background:#b91c1c;
    }

    .student{
        background:#2563eb;
    }

    .student:hover{
        background:#1d4ed8;
    }

</style>
```

</head>

<body>

<div class="container">

```
<h1>📝 Online Quiz Application</h1>

<p>Select Login Type</p>

<button class="btn admin"
onclick="adminLogin()">
    Admin Login
</button>

<button class="btn student"
onclick="studentLogin()">
    Student Login
</button>
```

</div>

<script>

function adminLogin(){
    window.location.href="admin-login.html";
}

function studentLogin(){
    window.location.href="login.html";
}

</script>

</body>
</html>
