<!DOCTYPE html>
<html>
<head>
<title>View Results</title>

<style>

body{
    font-family:Arial;
    background:#f4f6f9;
}

.container{
    width:90%;
    margin:auto;
    margin-top:30px;
}

h1{
    text-align:center;
    color:#1e3a8a;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
}

th,td{
    border:1px solid gray;
    padding:10px;
    text-align:center;
}

th{
    background:#2563eb;
    color:white;
}

</style>

</head>

<body>

<div class="container">

<h1>Quiz Results</h1>
<h3 id="totalQuiz"></h3>

<h3 id="averageScore"></h3>

<h3 id="bestScore"></h3>
<table>

<thead>
<tr>
<th>ID</th>
<th>Student ID</th>
<th>Quiz ID</th>
<th>Marks</th>
<th>Percentage</th>
</tr>
</thead>

<tbody id="resultTable">

</tbody>

</table>

</div>

<script>

async function loadResults(){

	let studentId =
		localStorage.getItem("studentId");

		let response =
		await fetch(
		"http://localhost:8080/getResultsByStudent/" + studentId
		);  

    let results =
    await response.json();

    let data = "";
    let totalQuiz = results.length;

    let totalPercentage = 0;

    let bestScore = 0;

    for(let result of results){

        data += `
        <tr>
            <td>${result.id}</td>
            <td>${result.student.id}</td>
            <td>${result.quiz.id}</td>
            <td>${result.marks}</td>
            <td>${result.percentage}%</td>
        </tr>
        `;
        totalPercentage += result.percentage;

        if(result.percentage > bestScore){

            bestScore = result.percentage;

        }
    }
    let averageScore = 0;

    if(totalQuiz > 0){

        averageScore = totalPercentage / totalQuiz;

    }

    document.getElementById("totalQuiz").innerHTML =
    "Total Quizzes Attempted : " + totalQuiz;

    document.getElementById("averageScore").innerHTML =
    "Average Score : " + averageScore.toFixed(2) + "%";

    document.getElementById("bestScore").innerHTML =
    "Best Score : " + bestScore + "%";
    document.getElementById("resultTable").innerHTML = data;
}

loadResults();

</script>

</body>
</html>
