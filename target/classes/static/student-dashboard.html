<!DOCTYPE html>
<html>
<head>
<title>Student Dashboard</title>

<style>

body{
    font-family:Arial;
    background:#f5f5f5;
}

.dashboard{
    width:600px;
    margin:auto;
    margin-top:50px;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0px 0px 10px gray;
    text-align:center;
}

h1{
    color:#1e3a8a;
}

button{
    width:250px;
    padding:15px;
    margin:10px;
    border:none;
    border-radius:8px;
    background:#2563eb;
    color:white;
    font-size:16px;
    cursor:pointer;
}

</style>

</head>

<body>

<div class="dashboard">

<h1>Student Dashboard</h1>

<button onclick="startQuiz()">
Start Quiz
</button>

<br>

<button onclick="myResults()">
My Results
</button>

<br>

<button onclick="logout()">
Logout
</button>

</div>

<script>

function startQuiz(){

    window.location.href="quiz.html";

}

function myResults(){

    window.location.href="view-results.html";

}

function logout(){

    localStorage.clear();

    window.location.href="login.html";

}

</script>

</body>
</html>
