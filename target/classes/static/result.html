<!DOCTYPE html>
<html>
<head>
    <title>Quiz Result</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background: linear-gradient(to right,#dbeafe,#bfdbfe);
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            margin:0;
        }

        .result-box{
            background:white;
            padding:30px;
            width:400px;
            text-align:center;
            border-radius:15px;
            box-shadow:0px 0px 15px gray;
        }

        h1{
            color:#2563eb;
        }

        h2{
            color:green;
        }

        button{
            background:#2563eb;
            color:white;
            border:none;
            padding:12px 20px;
            border-radius:8px;
            cursor:pointer;
            font-size:16px;
        }

    </style>

</head>

<body>

<div class="result-box">

    <h1>🎉 Quiz Result</h1>

    <h2 id="percentage">Percentage : 100%</h2>

    <h3 id="marks">Marks : 3</h3>

    <button onclick="goLogin()">Back To Login</button>

</div>

<script>

    let percentage = localStorage.getItem("percentage");

    let marks = localStorage.getItem("marks");

    if(percentage != null){
        document.getElementById("percentage").innerHTML =
        "Percentage : " + percentage + "%";
    }

    if(marks != null){
        document.getElementById("marks").innerHTML =
        "Marks : " + marks;
    }

    function goLogin(){
        window.location.href="login.html";
    }

</script>

</body>
</html>
