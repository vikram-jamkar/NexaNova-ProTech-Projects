<!DOCTYPE html>
<html>
<head>
    <title>Online Quiz Application - Login</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background: linear-gradient(to right,#dbeafe,#bfdbfe);
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            margin:0;
        }

        .login-box{
            background:white;
            width:400px;
            padding:30px;
            border-radius:15px;
            box-shadow:0px 0px 15px gray;
            text-align:center;
        }

        h1{
            color:#1e3a8a;
            margin-bottom:10px;
        }

        p{
            color:gray;
        }

        input{
            width:90%;
            padding:12px;
            margin-top:15px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:16px;
        }

        button{
            width:95%;
            padding:12px;
            margin-top:20px;
            background:#2563eb;
            color:white;
            border:none;
            border-radius:8px;
            font-size:18px;
            cursor:pointer;
        }

        button:hover{
            background:#1d4ed8;
        }

    </style>

</head>

<body>

<div class="login-box">

    <h1>📝 Online Quiz</h1>

    <p>Login to Start Your Quiz</p>

    <input type="text" id="username" placeholder="Enter Username">

    <input type="password" id="password" placeholder="Enter Password">

    <button onclick="login()">Login</button>

</div>

<script>
async function login(){

    let username =
    document.getElementById("username").value;

    let password =
    document.getElementById("password").value;

    if(username=="" || password==""){

        alert("Please Enter Username and Password");
        return;

    }

    let response =
    await fetch(
    "http://localhost:8080/loginStudent",
    {
        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({

            email:username,
            password:password

        })
    });

    let student =
    await response.json();

    localStorage.setItem(
    "studentId",
    student.id
    );

    window.location.href="student-dashboard.html";
 
}

</script>

</body>
</html>
