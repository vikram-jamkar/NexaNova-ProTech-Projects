<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background: linear-gradient(to right,#dbeafe,#bfdbfe);
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            margin:0;
        }

        .login-box{
            background:white;
            width:400px;
            padding:30px;
            border-radius:15px;
            box-shadow:0px 0px 15px gray;
            text-align:center;
        }

        h1{
            color:#1e3a8a;
        }

        input{
            width:90%;
            padding:12px;
            margin-top:15px;
            border:1px solid #ccc;
            border-radius:8px;
        }

        button{
            width:95%;
            padding:12px;
            margin-top:20px;
            background:#2563eb;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;
        }

    </style>
</head>

<body>

<div class="login-box">

    <h1>Admin Login</h1>

    <input type="text" id="username"
    placeholder="Enter Admin Name">

    <input type="password" id="password"
    placeholder="Enter Password">

    <button onclick="login()">
        Login
    </button>

</div>

<script>

function login(){

    let username =
    document.getElementById("username").value;

    let password =
    document.getElementById("password").value;

    if(username=="admin" &&
       password=="admin123"){

        window.location.href =
        "admin-dashboard.html";
    }
    else{

        alert("Invalid Admin Login");
    }
}

</script>

</body>
</html>
